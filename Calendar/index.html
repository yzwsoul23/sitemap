<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班日历</title>
<script src="lunar.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 16px;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    padding: 28px;
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 22px;
    text-align: center;
    color: #333;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .weekdays, .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .weekdays { margin-bottom: 4px; }
  .weekdays div {
    text-align: center;
    font-size: 13px;
    color: #999;
    padding: 6px 0;
  }
  .day {
    aspect-ratio: auto;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    border: 1px solid #e8e8e8;
    background: #fafafa;
    transition: all .15s;
    position: relative;
    padding: 6px 2px 4px;
    gap: 2px;
  }
  .day:hover { border-color: #4096ff; }
  .day.empty { background: transparent; border: none; cursor: default; }
  .day-num {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.2;
    color: #333;
  }
  .day-lunar {
    font-size: 11px;
    color: #999;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    max-width: 100%;
  }
  /* 法定休息日：浅蓝底色 */
  .day.holiday {
    background: #e6f4ff;
    border-color: #91caff;
  }
  .day.holiday .day-num { color: #1677ff; }
  .day.holiday .day-lunar { color: #4096ff; }
  /* 调休上班日 */
  .day.workday {
    background: #fff7e6;
    border-color: #ffd591;
  }
  /* 休/班 角标 */
  .day-badge {
    position: absolute;
    top: -1px;
    right: -1px;
    font-size: 10px;
    width: 18px;
    height: 18px;
    line-height: 18px;
    text-align: center;
    border-radius: 0 10px 0 8px;
    color: #fff;
    font-weight: 500;
  }
  .day-badge.xiu { background: #1677ff; }
  .day-badge.ban { background: #fa8c16; }
  /* 选中态 */
  .day.selected {
    background: #1677ff;
    border-color: #1677ff;
  }
  .day.selected .day-num { color: #fff; }
  .day.selected .day-lunar { color: rgba(255,255,255,.85); }
  .day.selected .day-badge.xiu { background: #fff; color: #1677ff; }
  .day.selected .day-badge.ban { background: #fff; color: #fa8c16; }
  /* 月份切换 */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 4px;
  }
  .month-nav h1 { margin-bottom: 0; min-width: 180px; }
  .month-nav button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #d9d9d9;
    background: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    color: #666;
    transition: all .15s;
  }
  .month-nav button:hover { border-color: #1677ff; color: #1677ff; }

  /* 节日文字标红 */
  .day-lunar.festival { color: #ff4d4f; }
  .day.selected .day-lunar.festival { color: #fff; }

  .result {
    margin-top: 20px;
    padding: 12px;
    background: #f6ffed;
    border: 1px solid #b7eb8f;
    border-radius: 8px;
    font-size: 15px;
    color: #333;
    min-height: 46px;
    word-break: break-all;
  }
  .result .label { color: #52c41a; font-size: 13px; margin-right: 6px; }
  .btn {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .reverse-box {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  .reverse-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .reverse-input:focus { border-color: #1677ff; }
  .btn-reverse { background: #fa8c16; color: #fff; white-space: nowrap; width: auto; padding: 10px 18px; font-size: 14px; }
  .btn-reverse:hover { background: #ffa940; }
  .btn-copy { background: #1677ff; color: #fff; }
  .btn-copy:hover { background: #4096ff; }
  .btn-download { background: #52c41a; color: #fff; margin-top: 10px; }
  .btn-download:hover { background: #73d13d; }
  .btn-clear { background: #f5f5f5; color: #666; margin-top: 10px; }
  .btn-clear:hover { background: #e8e8e8; }
  .toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.75);
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="month-nav">
    <button id="prevMonth" title="上个月">&#8249;</button>
    <h1 id="title"></h1>
    <button id="nextMonth" title="下个月">&#8250;</button>
  </div>
  <div class="subtitle">点击或按住拖动选择日期</div>
  <div class="weekdays">
    <div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div>
  </div>
  <div class="days" id="days"></div>
  <div class="result" id="result"><span class="label">已选：</span>暂无</div>
  <div class="reverse-box">
    <input class="reverse-input" id="reverseInput" placeholder="输入日期，如：4，8，11，18" autocomplete="off">
    <button class="btn btn-reverse" id="reverseBtn">反向标注</button>
  </div>
  <button class="btn btn-copy" id="copyBtn">复制排班</button>
  <button class="btn btn-download" id="downloadBtn">下载排班图</button>
  <button class="btn btn-clear" id="clearBtn">清空选择</button>
</div>
<div class="toast" id="toast"></div>

<script>
  // ===== 法定节假日数据（每年国务院公布后更新）=====
  // key: "YYYY-M-D"（M 为 1-12），value: "xiu"=休息日 / "ban"=调休上班
  const HOLIDAY_MAP = {
    // 2025
    "2025-1-1":"xiu",
    "2025-1-26":"ban","2025-1-28":"xiu","2025-1-29":"xiu","2025-1-30":"xiu","2025-1-31":"xiu","2025-2-1":"xiu","2025-2-2":"xiu","2025-2-3":"xiu","2025-2-4":"xiu","2025-2-8":"ban",
    "2025-4-4":"xiu","2025-4-5":"xiu","2025-4-6":"xiu",
    "2025-4-27":"ban","2025-5-1":"xiu","2025-5-2":"xiu","2025-5-3":"xiu","2025-5-4":"xiu","2025-5-5":"xiu",
    "2025-5-31":"xiu","2025-6-1":"xiu","2025-6-2":"xiu",
    "2025-9-28":"ban","2025-10-1":"xiu","2025-10-2":"xiu","2025-10-3":"xiu","2025-10-4":"xiu","2025-10-5":"xiu","2025-10-6":"xiu","2025-10-7":"xiu","2025-10-8":"xiu","2025-10-11":"ban",
    // 2026
    "2026-1-1":"xiu","2026-1-2":"xiu","2026-1-3":"xiu","2026-1-4":"ban",
    "2026-2-14":"ban","2026-2-15":"xiu","2026-2-16":"xiu","2026-2-17":"xiu","2026-2-18":"xiu","2026-2-19":"xiu","2026-2-20":"xiu","2026-2-21":"xiu","2026-2-22":"xiu","2026-2-23":"xiu","2026-2-28":"ban",
    "2026-4-4":"xiu","2026-4-5":"xiu","2026-4-6":"xiu",
    "2026-4-26":"ban","2026-5-1":"xiu","2026-5-2":"xiu","2026-5-3":"xiu","2026-5-4":"xiu","2026-5-5":"xiu",
    "2026-6-19":"xiu","2026-6-20":"xiu","2026-6-21":"xiu",
    "2026-9-25":"xiu","2026-9-26":"xiu","2026-9-27":"xiu",
    "2026-9-26":"ban","2026-10-1":"xiu","2026-10-2":"xiu","2026-10-3":"xiu","2026-10-4":"xiu","2026-10-5":"xiu","2026-10-6":"xiu","2026-10-7":"xiu","2026-10-8":"xiu","2026-10-10":"ban",
  };

  // 月份状态：默认规则——当天≤20号显示当月，>20号显示下月
  const _now = new Date();
  const _d = _now.getDate();
  let viewYear = _now.getFullYear();
  let viewMonth = _now.getMonth(); // 0-based
  if (_d > 20) {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  }

  let daysInMonth = 0;
  let firstWeekday = 0;

  // ===== 农历/节日工具 =====
  function getDayInfo(d) {
    const solar = Solar.fromYmd(viewYear, viewMonth + 1, d);
    const lunar = solar.getLunar();
    const key = viewYear + '-' + (viewMonth + 1) + '-' + d;
    const holidayType = HOLIDAY_MAP[key] || null;

    // 显示文本优先级：阳历节日 > 阴历节日 > 节气 > 农历日期
    let text = '';
    let isFestival = false;
    const solarFestivals = solar.getFestivals();
    const lunarFestivals = lunar.getFestivals();
    const jieqi = lunar.getJieQi();

    if (solarFestivals.length) {
      text = solarFestivals[0];
      isFestival = true;
    } else if (lunarFestivals.length) {
      text = lunarFestivals[0];
      isFestival = true;
    } else if (jieqi) {
      text = jieqi;
      isFestival = true;
    } else {
      // 农历初一显示月份名
      text = lunar.getDay() === 1 ? lunar.getMonthInChinese() + '月' : lunar.getDayInChinese();
    }

    return { text, isFestival, holidayType };
  }

  const daysEl = document.getElementById('days');
  const resultEl = document.getElementById('result');
  const selected = new Set();

  let isDragging = false;
  let dragSelect = true;

  function applyDrag(cell, d) {
    if (dragSelect && !selected.has(d)) {
      selected.add(d);
      cell.classList.add('selected');
      renderResult();
    } else if (!dragSelect && selected.has(d)) {
      selected.delete(d);
      cell.classList.remove('selected');
      renderResult();
    }
  }

  function renderCalendar() {
    daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    firstWeekday = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
    document.getElementById('title').textContent = viewYear + '年' + (viewMonth + 1) + '月排班';
    daysEl.innerHTML = '';

    for (let i = 0; i < firstWeekday; i++) {
      const blank = document.createElement('div');
      blank.className = 'day empty';
      daysEl.appendChild(blank);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const info = getDayInfo(d);
      const cell = document.createElement('div');
      cell.className = 'day';
      if (info.holidayType === 'xiu') cell.classList.add('holiday');
      if (info.holidayType === 'ban') cell.classList.add('workday');

      let html = '';
      if (info.holidayType) {
        html += '<span class="day-badge ' + info.holidayType + '">' + (info.holidayType === 'xiu' ? '休' : '班') + '</span>';
      }
      html += '<span class="day-num">' + d + '</span>';
      html += '<span class="day-lunar' + (info.isFestival ? ' festival' : '') + '">' + info.text + '</span>';
      cell.innerHTML = html;

      cell.addEventListener('mousedown', (e) => {
        e.preventDefault();
        isDragging = true;
        dragSelect = !selected.has(d);
        applyDrag(cell, d);
      });
      cell.addEventListener('mouseenter', () => {
        if (isDragging) applyDrag(cell, d);
      });
      cell.addEventListener('touchstart', () => {
        isDragging = true;
        dragSelect = !selected.has(d);
        applyDrag(cell, d);
      }, { passive: true });
      daysEl.appendChild(cell);
    }
  }

  renderCalendar();

  // 月份切换
  function switchMonth(offset) {
    viewMonth += offset;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    selected.clear();
    renderResult();
    renderCalendar();
  }
  document.getElementById('prevMonth').addEventListener('click', () => switchMonth(-1));
  document.getElementById('nextMonth').addEventListener('click', () => switchMonth(1));

  daysEl.addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const t = e.touches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.classList.contains('day') && !el.classList.contains('empty')) {
      const num = el.querySelector('.day-num');
      if (num) applyDrag(el, Number(num.textContent));
    }
  }, { passive: false });

  document.addEventListener('mouseup', () => isDragging = false);
  document.addEventListener('touchend', () => isDragging = false);

  function getSorted() {
    return [...selected].sort((a, b) => a - b);
  }

  function renderResult() {
    const list = getSorted();
    resultEl.innerHTML = list.length
      ? '<span class="label">已选 ' + list.length + ' 天：</span>' + list.join('，')
      : '<span class="label">已选：</span>暂无';
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const list = getSorted();
    if (!list.length) { showToast('请先选择日期'); return; }
    const text = list.join('，');
    try {
      await navigator.clipboard.writeText(text);
      showToast('已复制：' + text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制：' + text);
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    selected.clear();
    document.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
    renderResult();
  });

  document.getElementById('reverseBtn').addEventListener('click', () => {
    const raw = document.getElementById('reverseInput').value.trim();
    if (!raw) { showToast('请输入日期'); return; }
    const nums = raw.match(/\d+/g);
    if (!nums) { showToast('未识别到日期数字'); return; }
    const invalid = [];
    const valid = [];
    nums.forEach(n => {
      const d = Number(n);
      if (d >= 1 && d <= daysInMonth) { valid.push(d); } else { invalid.push(d); }
    });
    selected.clear();
    document.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
    valid.forEach(d => {
      selected.add(d);
      const cells = document.querySelectorAll('.day:not(.empty)');
      cells.forEach(cell => {
        const numEl = cell.querySelector('.day-num');
        if (numEl && Number(numEl.textContent) === d) cell.classList.add('selected');
      });
    });
    renderResult();
    if (invalid.length) {
      showToast('已标注 ' + valid.length + ' 天，' + invalid.length + ' 个无效日期被忽略');
    } else {
      showToast('已标注 ' + valid.length + ' 天');
    }
  });

  document.getElementById('reverseInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('reverseBtn').click();
  });

  // ===== 下载排班图 =====
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function wrapText(ctx, text, maxWidth) {
    const lines = [];
    let line = '';
    for (const ch of text) {
      if (line && ctx.measureText(line + ch).width > maxWidth) {
        lines.push(line);
        line = ch;
      } else {
        line += ch;
      }
    }
    if (line) lines.push(line);
    return lines;
  }

  document.getElementById('downloadBtn').addEventListener('click', () => {
    const scale = 2;
    const W = 700, pad = 30, gap = 6;
    const cell = (W - pad * 2 - gap * 6) / 7;
    const cellH = cell * 1.1;
    const rows = Math.ceil((firstWeekday + daysInMonth) / 7);
    const titleH = 50, weekH = 40, summaryPad = 20;
    const font = '"Microsoft YaHei", "PingFang SC", sans-serif';

    const list = getSorted();
    const summary = list.length ? '已选 ' + list.length + ' 天：' + list.join('，') : '未选择日期';

    const cv = document.createElement('canvas');
    const ctx = cv.getContext('2d');
    const summaryFont = '16px ' + font;
    ctx.font = summaryFont;
    const lines = wrapText(ctx, summary, W - pad * 2);
    const summaryH = lines.length * 24 + summaryPad;

    const gridH = rows * cellH + (rows - 1) * gap;
    const H = pad + titleH + weekH + gridH + summaryH + pad;
    cv.width = W * scale;
    cv.height = H * scale;
    ctx.scale(scale, scale);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // 标题
    ctx.fillStyle = '#333';
    ctx.font = 'bold 26px ' + font;
    ctx.fillText(viewYear + '年' + (viewMonth + 1) + '月排班', W / 2, pad + titleH / 2);

    // 星期头
    ctx.fillStyle = '#999';
    ctx.font = '14px ' + font;
    ['一','二','三','四','五','六','日'].forEach((w, i) => {
      ctx.fillText(w, pad + i * (cell + gap) + cell / 2, pad + titleH + weekH / 2);
    });

    // 日期格子
    const gridTop = pad + titleH + weekH;
    let d = 1;
    for (let r = 0; r < rows && d <= daysInMonth; r++) {
      for (let c = 0; c < 7 && d <= daysInMonth; c++) {
        if (r * 7 + c < firstWeekday) continue;
        const x = pad + c * (cell + gap);
        const y = gridTop + r * (cellH + gap);
        const isSel = selected.has(d);
        const info = getDayInfo(d);
        const isHoliday = info.holidayType === 'xiu';

        roundRect(ctx, x, y, cell, cellH, 10);

        if (isSel) {
          ctx.fillStyle = '#1677ff';
        } else if (isHoliday) {
          ctx.fillStyle = '#e6f4ff';
        } else {
          ctx.fillStyle = '#fafafa';
        }
        ctx.fill();

        if (!isSel) {
          ctx.strokeStyle = isHoliday ? '#91caff' : '#e8e8e8';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // 休/班角标
        if (info.holidayType) {
          const bx = x + cell - 18, by = y;
          ctx.beginPath();
          ctx.moveTo(bx + 18, by);
          ctx.lineTo(bx + 18, by + 14);
          ctx.lineTo(bx, by + 14);
          ctx.lineTo(bx, by);
          ctx.closePath();
          ctx.fillStyle = isSel ? '#fff' : (info.holidayType === 'xiu' ? '#1677ff' : '#fa8c16');
          ctx.fill();
          ctx.fillStyle = isSel ? '#1677ff' : '#fff';
          ctx.font = 'bold 10px ' + font;
          ctx.fillText(info.holidayType === 'xiu' ? '休' : '班', bx + 9, by + 7);
        }

        // 日期数字
        const numY = y + cellH * 0.35;
        ctx.fillStyle = isSel ? '#fff' : (isHoliday ? '#1677ff' : '#333');
        ctx.font = (isSel || isHoliday ? 'bold ' : '') + '20px ' + font;
        ctx.fillText(d, x + cell / 2, numY);

        // 农历/节日文字
        const lunarY = y + cellH * 0.7;
        ctx.fillStyle = isSel ? 'rgba(255,255,255,.85)' : (info.isFestival ? '#ff4d4f' : (isHoliday ? '#4096ff' : '#999'));
        ctx.font = '11px ' + font;
        ctx.fillText(info.text, x + cell / 2, lunarY);

        d++;
      }
    }

    // 底部汇总
    ctx.font = summaryFont;
    ctx.textAlign = 'left';
    ctx.fillStyle = '#333';
    let sy = gridTop + gridH + summaryPad + 12;
    lines.forEach(line => {
      ctx.fillText(line, pad, sy);
      sy += 24;
    });

    cv.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = viewYear + '年' + (viewMonth + 1) + '月排班.png';
      a.click();
      URL.revokeObjectURL(url);
      showToast('图片已下载');
    });
  });
</script>
</body>
</html>
