<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排班日历</title>
<script src="lunar.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #f0f2f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 16px;
  }
  .container {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08);
    padding: 28px;
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 22px;
    text-align: center;
    color: #333;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: 32px repeat(7, minmax(0, 1fr));
    gap: 4px;
  }
  .cal-grid .wd {
    text-align: center;
    font-size: 13px;
    color: #999;
    padding: 6px 0;
  }
  /* 左侧周数 */
  .week-num {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: #bbb;
  }
  /* 侧边上下箭头 */
  .nav-corner {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nav-corner button {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid #d9d9d9;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    color: #666;
    transition: all .15s;
    padding: 0;
  }
  .nav-corner button:hover { border-color: #1677ff; color: #1677ff; }
  .day {
    aspect-ratio: auto;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    cursor: pointer;
    user-select: none;
    border: 1px solid #e8e8e8;
    background: #fafafa;
    transition: all .15s;
    position: relative;
    padding: 6px 2px 4px;
    gap: 2px;
  }
  .day:hover { border-color: #4096ff; }
  .day.empty { background: transparent; border: none; cursor: default; }
  /* 上月末/下月初的占位日期：灰色、不可选中 */
  .day.other {
    background: transparent;
    border: none;
    cursor: default;
  }
  .day.other .day-num { color: #ccc; font-weight: 400; }
  .day.other .day-lunar { color: #ddd; }
  .day.other:hover { border: none; }
  .day-num {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.2;
    color: #333;
  }
  .day-lunar {
    font-size: 11px;
    color: #999;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    padding: 0 1px;
  }
  /* 长节日名自动缩小字号 */
  .day-lunar.long { font-size: 9px; letter-spacing: -0.5px; }
  /* 法定休息日：浅蓝底色 */
  .day.holiday {
    background: #e6f4ff;
    border-color: #91caff;
  }
  .day.holiday .day-num { color: #1677ff; }
  .day.holiday .day-lunar { color: #4096ff; }
  /* 调休上班日 */
  .day.workday {
    background: #fff7e6;
    border-color: #ffd591;
  }
  /* 休/班 角标 */
  .day-badge {
    position: absolute;
    top: -1px;
    right: -1px;
    font-size: 10px;
    width: 18px;
    height: 18px;
    line-height: 18px;
    text-align: center;
    border-radius: 0 10px 0 8px;
    color: #fff;
    font-weight: 500;
  }
  .day-badge.xiu { background: #1677ff; }
  .day-badge.ban { background: #fa8c16; }
  /* 选中态 */
  .day.selected {
    background: #1677ff;
    border-color: #1677ff;
  }
  .day.selected .day-num { color: #fff; }
  .day.selected .day-lunar { color: rgba(255,255,255,.85); }
  .day.selected .day-badge.xiu { background: #fff; color: #1677ff; }
  .day.selected .day-badge.ban { background: #fff; color: #fa8c16; }
  /* 月份切换 */
  .month-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 4px;
  }
  .month-nav h1 { margin-bottom: 0; min-width: 180px; }
  .month-nav button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid #d9d9d9;
    background: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    color: #666;
    transition: all .15s;
  }
  .month-nav button:hover { border-color: #1677ff; color: #1677ff; }

  /* 节日文字标红 */
  .day-lunar.festival { color: #ff4d4f; }
  .day.selected .day-lunar.festival { color: #fff; }

  .result {
    margin-top: 20px;
    padding: 12px;
    background: #f6ffed;
    border: 1px solid #b7eb8f;
    border-radius: 8px;
    font-size: 15px;
    color: #333;
    min-height: 46px;
    word-break: break-all;
  }
  .result .label { color: #52c41a; font-size: 13px; margin-right: 6px; }
  .btn {
    margin-top: 14px;
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background .15s;
  }
  .reverse-box {
    margin-top: 16px;
    display: flex;
    gap: 8px;
  }
  .reverse-input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #d9d9d9;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .reverse-input:focus { border-color: #1677ff; }
  .btn-reverse { background: #fa8c16; color: #fff; white-space: nowrap; width: auto; padding: 10px 18px; font-size: 14px; }
  .btn-reverse:hover { background: #ffa940; }
  .btn-copy { background: #1677ff; color: #fff; }
  .btn-copy:hover { background: #4096ff; }
  .btn-download { background: #52c41a; color: #fff; margin-top: 10px; }
  .btn-download:hover { background: #73d13d; }
  .btn-clear { background: #f5f5f5; color: #666; margin-top: 10px; }
  .btn-clear:hover { background: #e8e8e8; }
  .toast {
    position: fixed;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.75);
    color: #fff;
    padding: 10px 24px;
    border-radius: 20px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
  <div class="month-nav">
    <h1 id="title"></h1>
  </div>
  <div class="subtitle">点击或按住拖动选择日期</div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="result" id="result"><span class="label">已选：</span>暂无</div>
  <div class="reverse-box">
    <input class="reverse-input" id="reverseInput" placeholder="输入日期，如：4，8，11，18" autocomplete="off">
    <button class="btn btn-reverse" id="reverseBtn">反向标注</button>
  </div>
  <button class="btn btn-copy" id="copyBtn">复制排班</button>
  <button class="btn btn-download" id="downloadBtn">下载排班图</button>
  <button class="btn btn-clear" id="clearBtn">清空选择</button>
</div>
<div class="toast" id="toast"></div>

<script>
  // ===== 法定节假日数据 =====
  // 【更新说明】每年国务院公布后更新，通过 timor.tech API 获取整年数据：
  //   https://timor.tech/api/holiday/year/2027/   ← 把年份换成目标年
  //   支持 HTTP/HTTPS，API 返回 JSON，holiday 字段：true=休，false=班
  //   只需在每年年末获取一次次年数据，手动粘贴到下方 HOLIDAY_MAP
  // key: "YYYY-M-D"（M 为 1-12），value: "xiu"=休息日 / "ban"=调休上班
  const HOLIDAY_MAP = {
    // 2025
    "2025-1-1":"xiu",
    "2025-1-26":"ban","2025-1-28":"xiu","2025-1-29":"xiu","2025-1-30":"xiu","2025-1-31":"xiu","2025-2-1":"xiu","2025-2-2":"xiu","2025-2-3":"xiu","2025-2-4":"xiu","2025-2-8":"ban",
    "2025-4-4":"xiu","2025-4-5":"xiu","2025-4-6":"xiu",
    "2025-4-27":"ban","2025-5-1":"xiu","2025-5-2":"xiu","2025-5-3":"xiu","2025-5-4":"xiu","2025-5-5":"xiu",
    "2025-5-31":"xiu","2025-6-1":"xiu","2025-6-2":"xiu",
    "2025-9-28":"ban","2025-10-1":"xiu","2025-10-2":"xiu","2025-10-3":"xiu","2025-10-4":"xiu","2025-10-5":"xiu","2025-10-6":"xiu","2025-10-7":"xiu","2025-10-8":"xiu","2025-10-11":"ban",
    // 2026
    "2026-1-1":"xiu","2026-1-2":"xiu","2026-1-3":"xiu","2026-1-4":"ban",
    "2026-2-14":"ban","2026-2-15":"xiu","2026-2-16":"xiu","2026-2-17":"xiu","2026-2-18":"xiu","2026-2-19":"xiu","2026-2-20":"xiu","2026-2-21":"xiu","2026-2-22":"xiu","2026-2-23":"xiu","2026-2-28":"ban",
    "2026-4-4":"xiu","2026-4-5":"xiu","2026-4-6":"xiu",
    "2026-5-1":"xiu","2026-5-2":"xiu","2026-5-3":"xiu","2026-5-4":"xiu","2026-5-5":"xiu","2026-5-9":"ban",
    "2026-6-19":"xiu","2026-6-20":"xiu","2026-6-21":"xiu",
    "2026-9-20":"ban","2026-9-25":"xiu","2026-9-26":"xiu","2026-9-27":"xiu",
    "2026-10-1":"xiu","2026-10-2":"xiu","2026-10-3":"xiu","2026-10-4":"xiu","2026-10-5":"xiu","2026-10-6":"xiu","2026-10-7":"xiu","2026-10-10":"ban",
  };

  // 月份状态：默认规则——当天≤20号显示当月，>20号显示下月
  const _now = new Date();
  const _d = _now.getDate();
  let viewYear = _now.getFullYear();
  let viewMonth = _now.getMonth(); // 0-based
  if (_d > 20) {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  }

  let daysInMonth = 0;
  let firstWeekday = 0;

  // 长节日名缩写映射
  const FESTIVAL_SHORT = {
    '中国人民警察节': '警察节',
    '国际劳动节': '劳动节',
    '五四青年节': '青年节',
    '国际儿童节': '儿童节',
    '中国共产党诞辰': '建党节',
    '中国人民解放军建军节': '建军节',
    '中华人民共和国国庆节': '国庆节',
    '南京大屠杀纪念日': '公祭日',
  };

  // 截断过长的节日名：优先查映射，否则按字符截断
  function shortenFestival(name) {
    if (FESTIVAL_SHORT[name]) return FESTIVAL_SHORT[name];
    if (name.length <= 4) return name;
    // 去掉常见前缀再截断
    const stripped = name.replace(/^(世界|国际|全国|中国)/, '');
    if (stripped.length <= 4 && stripped.length >= 2) return stripped;
    return name.slice(0, 4);
  }

  // ===== 农历/节日工具（y/m/d 公历） =====
  function getDayInfo(d, y, m) {
    y = y === undefined ? viewYear : y;
    m = m === undefined ? viewMonth : m;
    const solar = Solar.fromYmd(y, m + 1, d);
    const lunar = solar.getLunar();
    const key = y + '-' + (m + 1) + '-' + d;
    const holidayType = HOLIDAY_MAP[key] || null;

    // 显示文本优先级：阳历节日 > 阴历节日 > 节气 > 农历日期
    let text = '';
    let isFestival = false;
    const solarFestivals = solar.getFestivals();
    const lunarFestivals = lunar.getFestivals();
    const jieqi = lunar.getJieQi();

    if (solarFestivals.length) {
      text = shortenFestival(solarFestivals[0]);
      isFestival = true;
    } else if (lunarFestivals.length) {
      text = shortenFestival(lunarFestivals[0]);
      isFestival = true;
    } else if (jieqi) {
      text = jieqi;
      isFestival = true;
    } else {
      // 农历初一显示月份名
      text = lunar.getDay() === 1 ? lunar.getMonthInChinese() + '月' : lunar.getDayInChinese();
    }

    return { text, isFestival, holidayType };
  }

  const daysEl = document.getElementById('calGrid');
  const resultEl = document.getElementById('result');
  const selected = new Set();

  let isDragging = false;
  let dragSelect = true;

  function applyDrag(cell, d) {
    if (dragSelect && !selected.has(d)) {
      selected.add(d);
      cell.classList.add('selected');
      renderResult();
    } else if (!dragSelect && selected.has(d)) {
      selected.delete(d);
      cell.classList.remove('selected');
      renderResult();
    }
  }

  // 计算 ISO 周数
  function getWeekNumber(y, m, d) {
    const date = new Date(Date.UTC(y, m, d));
    const dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    const firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    return Math.round(((date - firstThursday) / 86400000 - 3 + ((firstThursday.getUTCDay() + 6) % 7)) / 7) + 1;
  }

  function renderCalendar() {
    daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    firstWeekday = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
    document.getElementById('title').textContent = viewYear + '年' + (viewMonth + 1) + '月排班';

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    // 第一行：上箭头 + 星期头
    const prevNav = document.createElement('div');
    prevNav.className = 'nav-corner';
    prevNav.innerHTML = '<button id="prevMonthBtn" title="上个月">&#8743;</button>';
    grid.appendChild(prevNav);
    ['一','二','三','四','五','六','日'].forEach(w => {
      const el = document.createElement('div');
      el.className = 'wd';
      el.textContent = w;
      grid.appendChild(el);
    });

    // 生成当月所有格子数据：{ d, y, m, other }
    const prevMonthDays = new Date(viewYear, viewMonth, 0).getDate();
    const prevY = viewMonth === 0 ? viewYear - 1 : viewYear;
    const prevM = viewMonth === 0 ? 11 : viewMonth - 1;
    const nextY = viewMonth === 11 ? viewYear + 1 : viewYear;
    const nextM = viewMonth === 11 ? 0 : viewMonth + 1;
    const totalCells = firstWeekday + daysInMonth;
    const trailCount = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);

    const cells = [];
    for (let i = 0; i < firstWeekday; i++) {
      cells.push({ d: prevMonthDays - firstWeekday + 1 + i, y: prevY, m: prevM, other: true });
    }
    for (let d = 1; d <= daysInMonth; d++) {
      cells.push({ d: d, y: viewYear, m: viewMonth, other: false });
    }
    for (let d = 1; d <= trailCount; d++) {
      cells.push({ d: d, y: nextY, m: nextM, other: true });
    }

    // 按周分行渲染：周数 + 7 天
    const weekCount = cells.length / 7;
    for (let w = 0; w < weekCount; w++) {
      const first = cells[w * 7];
      const weekNum = getWeekNumber(first.y, first.m, first.d);
      const wn = document.createElement('div');
      wn.className = 'week-num';
      wn.textContent = weekNum;
      grid.appendChild(wn);

      for (let i = w * 7; i < w * 7 + 7; i++) {
        const c = cells[i];
        const info = getDayInfo(c.d, c.y, c.m);
        const cell = document.createElement('div');

        if (c.other) {
          cell.className = 'day other';
          cell.innerHTML = '<span class="day-num">' + c.d + '</span>'
            + '<span class="day-lunar">' + info.text + '</span>';
          grid.appendChild(cell);
          continue;
        }

        const d = c.d;
        cell.className = 'day';
        if (info.holidayType === 'xiu') cell.classList.add('holiday');
        if (info.holidayType === 'ban') cell.classList.add('workday');

        let html = '';
        if (info.holidayType) {
          html += '<span class="day-badge ' + info.holidayType + '">' + (info.holidayType === 'xiu' ? '休' : '班') + '</span>';
        }
        html += '<span class="day-num">' + d + '</span>';
        html += '<span class="day-lunar' + (info.isFestival ? ' festival' : '') + '">' + info.text + '</span>';
        cell.innerHTML = html;

        cell.addEventListener('mousedown', (e) => {
          e.preventDefault();
          isDragging = true;
          dragSelect = !selected.has(d);
          applyDrag(cell, d);
        });
        cell.addEventListener('mouseenter', () => {
          if (isDragging) applyDrag(cell, d);
        });
        cell.addEventListener('touchstart', () => {
          isDragging = true;
          dragSelect = !selected.has(d);
          applyDrag(cell, d);
        }, { passive: true });
        grid.appendChild(cell);
      }
    }

    // 最后一行：下箭头
    const nextNav = document.createElement('div');
    nextNav.className = 'nav-corner';
    nextNav.innerHTML = '<button id="nextMonthBtn" title="下个月">&#8744;</button>';
    grid.appendChild(nextNav);

    // 绑定上下月按钮
    document.getElementById('prevMonthBtn').addEventListener('click', () => switchMonth(-1));
    document.getElementById('nextMonthBtn').addEventListener('click', () => switchMonth(1));
  }

  renderCalendar();

  // 月份切换
  function switchMonth(offset) {
    viewMonth += offset;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    selected.clear();
    renderResult();
    renderCalendar();
  }

  document.getElementById('calGrid').addEventListener('touchmove', (e) => {
    if (!isDragging) return;
    e.preventDefault();
    const t = e.touches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el && el.classList.contains('day') && !el.classList.contains('other')) {
      const num = el.querySelector('.day-num');
      if (num) applyDrag(el, Number(num.textContent));
    }
  }, { passive: false });

  document.addEventListener('mouseup', () => isDragging = false);
  document.addEventListener('touchend', () => isDragging = false);

  function getSorted() {
    return [...selected].sort((a, b) => a - b);
  }

  function renderResult() {
    const list = getSorted();
    resultEl.innerHTML = list.length
      ? '<span class="label">已选 ' + list.length + ' 天：</span>' + list.join('，')
      : '<span class="label">已选：</span>暂无';
  }

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1800);
  }

  document.getElementById('copyBtn').addEventListener('click', async () => {
    const list = getSorted();
    if (!list.length) { showToast('请先选择日期'); return; }
    const text = list.join('，');
    try {
      await navigator.clipboard.writeText(text);
      showToast('已复制：' + text);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      showToast('已复制：' + text);
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    selected.clear();
    document.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
    renderResult();
  });

  document.getElementById('reverseBtn').addEventListener('click', () => {
    const raw = document.getElementById('reverseInput').value.trim();
    if (!raw) { showToast('请输入日期'); return; }
    const nums = raw.match(/\d+/g);
    if (!nums) { showToast('未识别到日期数字'); return; }
    const invalid = [];
    const valid = [];
    nums.forEach(n => {
      const d = Number(n);
      if (d >= 1 && d <= daysInMonth) { valid.push(d); } else { invalid.push(d); }
    });
    selected.clear();
    document.querySelectorAll('.day.selected').forEach(el => el.classList.remove('selected'));
    valid.forEach(d => {
      selected.add(d);
      document.querySelectorAll('.day:not(.other)').forEach(cell => {
        const numEl = cell.querySelector('.day-num');
        if (numEl && Number(numEl.textContent) === d) cell.classList.add('selected');
      });
    });
    renderResult();
    if (invalid.length) {
      showToast('已标注 ' + valid.length + ' 天，' + invalid.length + ' 个无效日期被忽略');
    } else {
      showToast('已标注 ' + valid.length + ' 天');
    }
  });

  document.getElementById('reverseInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('reverseBtn').click();
  });

  // ===== 下载排班图 =====
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  document.getElementById('downloadBtn').addEventListener('click', () => {
    // 1:1 方形排班图：深青背景 + 白色圆角卡片 + 大日期数字
    const scale = 2;
    const S = 1000;                       // 逻辑边长
    const font = '"Microsoft YaHei", "PingFang SC", sans-serif';
    const BLUE = '#3f83f8', INK = '#222', GRAY = '#c9ced6';

    const cv = document.createElement('canvas');
    cv.width = S * scale;
    cv.height = S * scale;
    const ctx = cv.getContext('2d');
    ctx.scale(scale, scale);

    // 白色圆角卡片（卡片外透明）
    ctx.fillStyle = '#ffffff';
    roundRect(ctx, 0, 0, S, S, 60);
    ctx.fill();

    const padL = 45, padR = 45;           // 卡片内边距
    const gridW = S - padL - padR;
    const cellW = gridW / 7;

    // 标题：X月
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = INK;
    ctx.font = 'bold 60px ' + font;
    ctx.fillText((viewMonth + 1) + '月', padL, 90);

    // 星期头
    const weekY = 160;
    ctx.textAlign = 'center';
    ctx.font = 'bold 52px ' + font;
    ctx.fillStyle = INK;
    ['一','二','三','四','五','六','日'].forEach((w, i) => {
      ctx.fillText(w, padL + i * cellW + cellW / 2, weekY);
    });

    // 日期网格（间距紧凑）
    const gridTop = 220, gridBottom = S - 100;
    const trail = (firstWeekday + daysInMonth) % 7 === 0 ? 0 : 7 - (firstWeekday + daysInMonth) % 7;
    const rows = (firstWeekday + daysInMonth + trail) / 7;
    const cellH = (gridBottom - gridTop) / rows;

    const prevMDays = new Date(viewYear, viewMonth, 0).getDate();

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < 7; c++) {
        const idx = r * 7 + c;
        const cx = padL + c * cellW + cellW / 2;
        const cy = gridTop + r * cellH + cellH / 2;
        ctx.font = 'bold 60px ' + font;

        if (idx < firstWeekday) {          // 上月末
          ctx.fillStyle = GRAY;
          ctx.fillText(prevMDays - firstWeekday + 1 + idx, cx, cy);
          continue;
        }
        if (idx >= firstWeekday + daysInMonth) {  // 下月初
          ctx.fillStyle = GRAY;
          ctx.fillText(idx - (firstWeekday + daysInMonth) + 1, cx, cy);
          continue;
        }

        const d = idx - firstWeekday + 1;
        ctx.fillStyle = selected.has(d) ? BLUE : INK;  // 排班选中：蓝字
        ctx.fillText(d, cx, cy);
      }
    }

    cv.toBlob((blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = viewYear + '年' + (viewMonth + 1) + '月排班.png';
      a.click();
      URL.revokeObjectURL(url);
      showToast('图片已下载');
    });
  });
</script>
</body>
</html>
