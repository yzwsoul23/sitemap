<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工具箱</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient-start: #0f0f1e;
            --bg-gradient-end: #1a1a3d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-tools: #6366f1;
            --accent-entertainment: #ec4899;
            --accent-learning: #14b8a6;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 16px;
        }

        .container {
            max-width: 768px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 12px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            border-radius: 12px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-tools);
            background: rgba(255, 255, 255, 0.08);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .filter-buttons::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--accent-tools);
            border-color: var(--accent-tools);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 600px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 14px;
            }
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 16px;
            }
        }

        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-tools);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .card.category-tools::before {
            background: var(--accent-tools);
        }

        .card.category-entertainment::before {
            background: var(--accent-entertainment);
        }

        .card.category-learning::before {
            background: var(--accent-learning);
        }

        .card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.08);
        }

        .card:hover::before {
            transform: scaleX(1);
        }

        .card-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .category-tools .card-icon {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(99, 102, 241, 0.1));
        }

        .category-entertainment .card-icon {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2), rgba(236, 72, 153, 0.1));
        }

        .category-learning .card-icon {
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), rgba(20, 184, 166, 0.1));
        }

        .card-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 24px;
            }

            .grid {
                gap: 10px;
            }

            .card {
                padding: 14px 12px;
            }

            .card-icon {
                width: 32px;
                height: 32px;
                font-size: 18px;
                margin-bottom: 10px;
            }

            .card-name {
                font-size: 13px;
            }

            .card-desc {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 我的工具箱</h1>
            <p class="subtitle">便捷的个人网站导航</p>
        </header>

        <div class="search-container">
            <input type="text" class="search-input" placeholder="搜索网站..." id="searchInput">
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-category="all">全部</button>
            <button class="filter-btn" data-category="tools">工具</button>
            <button class="filter-btn" data-category="entertainment">娱乐</button>
            <button class="filter-btn" data-category="learning">学习</button>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <script>
        const websites = [
            {name:"盘点转excel", desc:"盘点内容转可粘贴为excel", url:"https://yzwsoul23.github.io/Inventory-to-Excel/", category:"tools", icon:"📋"},
            {name:"人员搜索", desc:"人员拼音搜索表", url:"https://yzwsoul23.github.io/zimu-search/", category:"tools", icon:"🔍"},
            {name:"数据列表", desc:"盘点数据列表管理", url:"https://yzwsoul23.github.io/Quick-inventory-check/", category:"tools", icon:"📊"},
            {name:"1A2B", desc:"1A2B 猜数字游戏", url:"https://yzwsoul23.github.io/1A2B/", category:"entertainment", icon:"🎮"},
            {name:"数据列表Beta", desc:"盘点数据列表管理Beta", url:"https://yzwsoul23.github.io/Quick-inventory-checkBata/", category:"tools", icon:"📈"},
            {name:"当代艺术驱动器", desc:"抽象话生成装置", url:"https://yzwsoul23.github.io/Contemporary-art-driver/", category:"entertainment", icon:"🎨"},
            {name:"选择题练习", desc:"选择题练习系统", url:"https://yzwsoul23.github.io/viewport/", category:"learning", icon:"📚"},
            {name:"字幕转txt", desc:"字幕时间轴信息移除工具", url:"https://yzwsoul23.github.io/SrtToTXT/", category:"tools", icon:"📝"},
            {name:"商品过期查询", desc:"根据生产日期和保质期查询是否过期", url:"https://yzwsoul23.github.io/expiryCheck/", category:"tools", icon:"📅"},
            {name:"表格数据过滤", desc:"过滤表格内容并筛选和添加字段", url:"https://yzwsoul23.github.io/codeItemPro/", category:"tools", icon:"⚙️"},
            {name:"多组表格查看器", desc:"多组表格配货操作", url:"https://yzwsoul23.github.io/showTable/", category:"tools", icon:"📄"},
            {name:"快递柜取件码管理系统", desc:"自动解析快递信息并分组显示", url:"https://yzwsoul23.github.io/pickupCode/", category:"tools", icon:"📦"},
            {name:"商品盘点系统", desc:"扫描或输入商品条码，快速盘点商品", url:"https://yzwsoul23.github.io/ScanCode/", category:"tools", icon:"🔧"},
            {name:"lrc歌词编辑器", desc:"根据歌曲可以手动给歌词打时间戳并导出lrc歌词文件", url:"https://yzwsoul23.github.io/lrcEditor/", category:"tools", icon:"🎵"},
            {name:"经文搜索", desc:"根据经文缩写可以搜索并显示经文内容", url:"https://yzwsoul23.github.io/bibleSearch/", category:"tools", icon:"📖"},
        ];

        function renderWebsites(filter = 'all', searchTerm = '') {
            const grid = document.getElementById('grid');
            let filtered = filter === 'all' ? websites : websites.filter(w => w.category === filter);
            
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(w => 
                    w.name.toLowerCase().includes(term) || 
                    w.desc.toLowerCase().includes(term)
                );
            }
            
            grid.innerHTML = filtered.map(site => `
                <a href="${site.url}" target="_blank" rel="noopener noreferrer">
                    <div class="card category-${site.category}">
                        <div class="card-content">
                            <div class="card-icon">${site.icon}</div>
                            <div class="card-name">${site.name}</div>
                            <div class="card-desc">${site.desc}</div>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const searchTerm = document.getElementById('searchInput').value;
                renderWebsites(btn.dataset.category, searchTerm);
            });
        });

        document.getElementById('searchInput').addEventListener('input', function() {
            const activeFilter = document.querySelector('.filter-btn.active').dataset.category;
            renderWebsites(activeFilter, this.value);
        });

        renderWebsites();
    </script>
</body>
</html>
