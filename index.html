<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的工具箱</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
        // 页面渲染前应用已保存的主题，避免刷新时闪烁（默认浅色）
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) {}
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light;
            --bg-gradient-start: #eef2f9;
            --bg-gradient-end: #dce3f0;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(15, 23, 42, 0.1);
            --text-primary: #1f2937;
            --text-secondary: rgba(31, 41, 55, 0.6);
            --shelf-bg: rgba(255, 255, 255, 0.55);
            --shelf-border: rgba(15, 23, 42, 0.08);
            --shelf-surface: rgba(255, 255, 255, 0.6);
            --shelf-label-bg: rgba(255, 255, 255, 0.9);
            --accent-tools: #6366f1;
            --accent-entertainment: #ec4899;
            --accent-learning: #14b8a6;
            --text-on-accent: #ffffff;
            --input-focus-bg: rgba(255, 255, 255, 0.95);
            --btn-hover-bg: rgba(15, 23, 42, 0.06);
            --toggle-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
            --shelf-edge-gradient: linear-gradient(to bottom,
                rgba(15, 23, 42, 0.08) 0%,
                rgba(15, 23, 42, 0.02) 50%,
                transparent 100%);
            --product-gradient: linear-gradient(145deg,
                rgba(255, 255, 255, 0.95) 0%,
                rgba(255, 255, 255, 0.65) 100%);
            --product-hover-gradient: linear-gradient(145deg,
                #ffffff 0%,
                rgba(255, 255, 255, 0.8) 100%);
            --product-shadow: 0 4px 6px rgba(15, 23, 42, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            --product-hover-shadow: 0 8px 16px rgba(15, 23, 42, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        html.dark {
            color-scheme: dark;
            --bg-gradient-start: #0f0f1e;
            --bg-gradient-end: #1a1a3d;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --shelf-bg: rgba(255, 255, 255, 0.03);
            --shelf-border: rgba(255, 255, 255, 0.06);
            --shelf-surface: rgba(255, 255, 255, 0.02);
            --shelf-label-bg: rgba(255, 255, 255, 0.08);
            --text-on-accent: #ffffff;
            --input-focus-bg: rgba(255, 255, 255, 0.08);
            --btn-hover-bg: rgba(255, 255, 255, 0.1);
            --toggle-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shelf-edge-gradient: linear-gradient(to bottom,
                rgba(255, 255, 255, 0.08) 0%,
                rgba(255, 255, 255, 0.02) 50%,
                transparent 100%);
            --product-gradient: linear-gradient(145deg,
                rgba(255, 255, 255, 0.06) 0%,
                rgba(255, 255, 255, 0.02) 100%);
            --product-hover-gradient: linear-gradient(145deg,
                rgba(255, 255, 255, 0.1) 0%,
                rgba(255, 255, 255, 0.04) 100%);
            --product-shadow: 0 4px 6px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            --product-hover-shadow: 0 8px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            padding: 16px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 12px;
        }

        .site-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .search-container {
            flex: 1;
            min-width: 200px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: var(--accent-tools);
            background: var(--input-focus-bg);
        }

        .search-input::placeholder {
            color: var(--text-secondary);
        }

        .filter-buttons {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .filter-buttons::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            background: var(--btn-hover-bg);
        }

        .filter-btn.active {
            background: var(--accent-tools);
            border-color: var(--accent-tools);
            color: var(--text-on-accent);
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--toggle-shadow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: var(--btn-hover-bg);
            transform: scale(1.08);
        }

        /* 货架样式 */
        .shelf-section {
            margin-bottom: 32px;
        }

        .shelf-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: var(--shelf-label-bg);
            border: 1px solid var(--shelf-border);
            border-radius: 6px 6px 0 0;
            font-size: 13px;
            font-weight: 600;
            margin-left: 12px;
            position: relative;
            z-index: 2;
        }

        .shelf-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .shelf-label .dot.tools { background: var(--accent-tools); }
        .shelf-label .dot.entertainment { background: var(--accent-entertainment); }
        .shelf-label .dot.learning { background: var(--accent-learning); }

        .shelf {
            background: var(--shelf-bg);
            border: 1px solid var(--shelf-border);
            border-radius: 12px;
            padding: 24px 20px 20px;
            position: relative;
        }

        /* 货架层板效果 */
        .shelf::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 8px;
            background: var(--shelf-edge-gradient);
            border-radius: 0 0 12px 12px;
        }

        .shelf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        /* 商品卡片 - 货架上的盒子 */
        .product {
            background: var(--product-gradient);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: var(--product-shadow);
        }

        /* 商品顶部标签条 */
        .product::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 8px 8px 0 0;
            opacity: 0.6;
        }

        .product.cat-tools::before { background: var(--accent-tools); }
        .product.cat-entertainment::before { background: var(--accent-entertainment); }
        .product.cat-learning::before { background: var(--accent-learning); }

        .product:hover {
            transform: translateY(-4px);
            background: var(--product-hover-gradient);
            box-shadow: var(--product-hover-shadow);
        }

        .product-icon {
            font-size: 28px;
            margin-bottom: 10px;
            line-height: 1;
        }

        .product-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .product-desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 空货架提示 */
        .empty-shelf {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .empty-shelf .icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        @media (max-width: 640px) {
            body {
                padding: 12px;
            }

            .theme-toggle {
                top: 12px;
                right: 12px;
            }

            h1 {
                font-size: 24px;
            }

            .toolbar {
                flex-direction: column;
            }

            .search-container {
                min-width: 100%;
            }

            .filter-buttons {
                width: 100%;
            }

            .filter-btn {
                flex: 1;
                text-align: center;
            }

            .shelf {
                padding: 20px 12px 16px;
            }

            .shelf-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .product {
                padding: 12px 10px;
            }

            .product-icon {
                font-size: 24px;
            }

            .product-name {
                font-size: 12px;
            }

            .product-desc {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>
    <button id="themeToggle" class="theme-toggle" type="button" title="切换深色模式" aria-label="切换深色模式">🌙</button>
    <div class="container">
        <header>
            <img src="logo.svg" alt="Logo" class="site-logo">
            <h1>我的工具箱</h1>
            <p class="subtitle">便捷的个人网站导航</p>
        </header>

        <div class="toolbar">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="搜索商品..." id="searchInput">
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" data-category="all">全部</button>
                <button class="filter-btn" data-category="tools">工具</button>
                <button class="filter-btn" data-category="entertainment">娱乐</button>
                <button class="filter-btn" data-category="learning">学习</button>
            </div>
        </div>

        <div id="shelves"></div>
    </div>

    <script>
        const websites = [
            {name:"盘点转excel", desc:"盘点内容转可粘贴为excel", url:"Inventory-to-Excel/", category:"tools", icon:"📋"},
            {name:"人员搜索", desc:"人员拼音搜索表", url:"zimu-search/", category:"tools", icon:"🔍"},
            {name:"数据列表", desc:"盘点数据列表管理", url:"Quick-inventory-check/", category:"tools", icon:"📊"},
            {name:"1A2B", desc:"1A2B 猜数字游戏", url:"1A2B/", category:"entertainment", icon:"🎮"},
            {name:"数据列表Beta", desc:"盘点数据列表管理Beta", url:"Quick-inventory-checkBata/", category:"tools", icon:"📈"},
            {name:"当代艺术驱动器", desc:"抽象话生成装置", url:"Contemporary-art-driver/", category:"entertainment", icon:"🎨"},
            {name:"选择题练习", desc:"选择题练习系统", url:"viewport/", category:"learning", icon:"📚"},
            {name:"字幕转txt", desc:"字幕时间轴信息移除工具", url:"SrtToTXT/", category:"tools", icon:"📝"},
            {name:"商品过期查询", desc:"根据生产日期和保质期查询是否过期", url:"expiryCheck/", category:"tools", icon:"📅"},
            {name:"排班日历", desc:"点击或按住拖动选择日期，快速生成排班日期", url:"Calendar/", category:"tools", icon:"🗓️"},
            {name:"表格数据过滤", desc:"过滤表格内容并筛选和添加字段", url:"codeItemPro/", category:"tools", icon:"⚙️"},
            {name:"多组表格查看器", desc:"多组表格配货操作", url:"showTable/", category:"tools", icon:"📄"},
            {name:"快递柜取件码管理系统", desc:"自动解析快递信息并分组显示", url:"pickupCode/", category:"tools", icon:"📦"},
            {name:"商品盘点系统", desc:"扫描或输入商品条码，快速盘点商品", url:"ScanCode/", category:"tools", icon:"🔧"},
            {name:"lrc歌词编辑器", desc:"根据歌曲可以手动给歌词打时间戳并导出lrc歌词文件", url:"lrcEditor/", category:"tools", icon:"🎵"},
            {name:"经文搜索", desc:"根据经文缩写可以搜索并显示经文内容", url:"bibleSearch/", category:"tools", icon:"📖"},
            {name:"中文说唱档案", desc:"中文说唱歌手人物志与音乐作品目录", url:"https://rapper.958263.xyz/", category:"entertainment", icon:"🎤"},
        ];

        const categories = [
            { key: 'tools', label: '工具', count: 0 },
            { key: 'entertainment', label: '娱乐', count: 0 },
            { key: 'learning', label: '学习', count: 0 }
        ];

        function renderShelves(filter = 'all', searchTerm = '') {
            const container = document.getElementById('shelves');
            let filtered = filter === 'all' ? websites : websites.filter(w => w.category === filter);

            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filtered = filtered.filter(w =>
                    w.name.toLowerCase().includes(term) ||
                    w.desc.toLowerCase().includes(term)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="shelf-section">
                        <div class="shelf-label">
                            <span class="dot tools"></span>搜索
                        </div>
                        <div class="shelf">
                            <div class="empty-shelf">
                                <div class="icon">📦</div>
                                <p>货架上没找到相关商品</p>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            const shelfData = categories.map(cat => ({
                ...cat,
                items: filtered.filter(w => w.category === cat.key)
            })).filter(shelf => shelf.items.length > 0);

            container.innerHTML = shelfData.map(shelf => `
                <div class="shelf-section">
                    <div class="shelf-label">
                        <span class="dot ${shelf.key}"></span>${shelf.label} · ${shelf.items.length} 件
                    </div>
                    <div class="shelf">
                        <div class="shelf-grid">
                            ${shelf.items.map(site => `
                                <a href="${site.url}" target="_blank" rel="noopener noreferrer">
                                    <div class="product cat-${site.category}">
                                        <div class="product-icon">${site.icon}</div>
                                        <div class="product-name">${site.name}</div>
                                        <div class="product-desc">${site.desc}</div>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const searchTerm = document.getElementById('searchInput').value;
                renderShelves(btn.dataset.category, searchTerm);
            });
        });

        document.getElementById('searchInput').addEventListener('input', function() {
            const activeFilter = document.querySelector('.filter-btn.active').dataset.category;
            renderShelves(activeFilter, this.value);
        });

        // 主题切换：默认浅色，点击在深色/浅色间切换，偏好保存到 localStorage
        const themeToggle = document.getElementById('themeToggle');

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            document.documentElement.classList.toggle('dark', isDark);
            themeToggle.textContent = isDark ? '☀️' : '🌙';
            themeToggle.title = isDark ? '切换浅色模式' : '切换深色模式';
            themeToggle.setAttribute('aria-label', themeToggle.title);
        }

        function getSavedTheme() {
            try {
                return localStorage.getItem('theme') === 'dark' ? 'dark' : 'light';
            } catch (e) {
                return 'light';
            }
        }

        applyTheme(getSavedTheme());

        themeToggle.addEventListener('click', () => {
            const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
            try { localStorage.setItem('theme', next); } catch (e) {}
            applyTheme(next);
        });

        renderShelves();
    </script>
</body>
</html>
